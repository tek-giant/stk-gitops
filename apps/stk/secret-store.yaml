# Where External Secrets fetches passwords from: AWS Secrets Manager in eu-west-2.
# No auth block: External Secrets uses its own Pod Identity role (stk-dev-external-secrets),
# which may read only the RDS secret (rds!db-*).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-2
