# Copies the database password from AWS Secrets Manager into a Kubernetes Secret
# called stk-db, and refreshes it every hour (RDS rotates the password).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stk-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: stk-db
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: rds!db-62293416-6f2e-4031-b863-25f9b106c3c2
        property: password
